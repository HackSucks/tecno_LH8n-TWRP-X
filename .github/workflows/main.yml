name: Build TWRP for TECNO LH8n

on:
  workflow_dispatch:
    inputs:
      firmware_version:
        description: 'Firmware version to build for'
        required: true
        default: 'V659'
        type: choice
        options:
          - V659
          - V792
          - BOTH

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192      # ← increase from 4096; apt needs headroom on root
          swap-size-mb: 4096         # ← reduce swap to compensate
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Setup build environment
        run: |
          # Redirect apt cache onto the large build volume, not root fs
          sudo mkdir -p $GITHUB_WORKSPACE/apt-cache
          sudo apt-get -o dir::cache=$GITHUB_WORKSPACE/apt-cache update
          sudo apt-get -o dir::cache=$GITHUB_WORKSPACE/apt-cache install -y \
            git-core gnupg flex bison build-essential \
            zip curl libc6-dev libncurses5-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip python3 \
            libssl-dev bc ccache lz4 schedtool \
            python-is-python3 rsync

      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.email "build@github.com"
          git config --global user.name "GitHub Actions"

      - name: Init TWRP manifest
        run: |
          mkdir -p $GITHUB_WORKSPACE/twrp
          cd $GITHUB_WORKSPACE/twrp
          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1 \
            --depth=1

      - name: Sync sources
        run: |
          cd $GITHUB_WORKSPACE/twrp
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Clone device tree
        run: |
          cd $GITHUB_WORKSPACE/twrp
          git clone https://github.com/HackSucks/tecno_LH8n-TWRP-X.git \
            -b android-12.1 \
            --depth=1 \
            device/tecno/LH8n

      - name: Inject V659 touch drivers
        if: ${{ github.event.inputs.firmware_version == 'V659' || github.event.inputs.firmware_version == 'BOTH' }}
        run: |
          DRIVER_BASE_URL="https://github.com/HackSucks/tecno_LH8n-TWRP-X/releases/download/v659drv"
          DRIVER_DEST="/twrp/device/tecno/LH8n/prebuilt/v659/touchscreen"

          mkdir -p "$DRIVER_DEST"

          for ko in adaptive-ts.ko focaltech_noflash_common.ko ilitek_common.ko; do
            echo "Downloading ${ko}..."
            curl -L --retry 3 --retry-delay 5 --fail \
              "${DRIVER_BASE_URL}/${ko}" \
              -o "${DRIVER_DEST}/${ko}"
            echo "Verifying ${ko}..."
            file "${DRIVER_DEST}/${ko}" | grep -q "ELF" \
              || { echo "ERROR: ${ko} does not appear to be a valid kernel module"; exit 1; }
          done

          echo "V659 touch drivers downloaded successfully:"
          ls -lh "$DRIVER_DEST"

      - name: Set build version name
        run: |
          cd $GITHUB_WORKSPACE/twrp
          BUILD_DATE=$(date +%Y%m%d)
          FIRMWARE=${{ github.event.inputs.firmware_version }}
          echo "CUSTOM_BUILD_NAME=TWRP-LH8n-12.1-NVMe-${FIRMWARE}-${BUILD_DATE}" >> $GITHUB_ENV

      - name: Build TWRP
        run: |
          cd $GITHUB_WORKSPACE/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          ccache -M 10G
          source build/envsetup.sh
          lunch twrp_LH8n-eng
          mka vendorbootimage 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: $GITHUB_WORKSPACE/twrp/build.log

      - name: Upload TWRP image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CUSTOM_BUILD_NAME }}
          path: $GITHUB_WORKSPACE/twrp/out/target/product/LH8n/vendor_boot.img
